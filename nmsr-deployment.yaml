apiVersion: apps/v1
kind: Deployment
metadata:
  name: nmsr-aas
spec:
  replicas: 2
  selector:
    matchLabels:
      app: nmsr
  template:
    metadata:
      labels:
        app: nmsr
    spec:
      containers:
      - name: nmsr-aas
        image: us-central1-docker.pkg.dev/live-ads-c783/nmsr-repo/nmsr-aas:v1
        ports:
        - containerPort: 8080
        resources:
          limits:
            cpu: "1"
            memory: "1Gi"
          requests:
            cpu: "500m"
            memory: "512Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: nmsr-service
spec:
  type: LoadBalancer
  selector:
    app: nmsr
  ports:
  - protocol: TCP
    port: 80
    targetPort: 8080